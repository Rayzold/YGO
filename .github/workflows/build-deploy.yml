name: Build & deploy

# Runs on every push, and nightly to pick up new cards and Forbidden & Limited List changes.
#  - build:        card data + tests + site
#  - publish-data: complete OCG+TCG database -> `data` branch (Supabase loads it from there)
#  - deploy:       GitHub Pages, opt-in with the repository variable DEPLOY_PAGES=true
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet pytest

      - name: Build card data (cards, banlists, mechanic tags)
        run: python pipeline/build_data.py --full full-data

      - name: Pipeline tests
        run: python -m pytest pipeline/tests -q

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

      - name: Build site
        run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
          # Supabase URL and publishable key default to src/lib/config.ts; repository variables override them
          VITE_SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}

      - name: Keep the full database for publishing
        uses: actions/upload-artifact@v4
        with:
          name: full-data
          path: full-data
          retention-days: 3

      - name: Upload site for Pages
        if: github.event_name != 'pull_request' && vars.DEPLOY_PAGES == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    if: github.event_name != 'pull_request' && vars.DEPLOY_PAGES == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  publish-data:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: full-data
          path: full-data
      - name: Publish to the data branch (single commit, replaced on every run)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd full-data
          cat > README.md <<'EOF'
          # YGO card database (generated)

          Rebuilt nightly by `.github/workflows/build-deploy.yml` on `main`. Do not edit.

          - `cards.json`  every OCG/TCG card: names in all languages, English text, mechanic tags,
            TCG/OCG legality, current and upcoming limits (0 Forbidden, 1 Limited, 2 Semi-Limited, 3 Unlimited)
          - `prints.json` English (TCG) and Japanese (OCG) prints, one row per rarity
          - `meta.json`   build time, banlist dates, counts

          Sources: YAML Yugi (cards) and YAML Yugi Limit Regulations (Konami banlists).
          Card names and text are © KONAMI.
          EOF
          git init -q -b data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Card data $(jq -r .built meta.json)"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" data
          jq -c . meta.json
